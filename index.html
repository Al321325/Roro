<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>✨ عيد ميلاد رغد - عالم السحر ✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Poppins', 'Arial', sans-serif;
            background: #000;
            position: relative;
            touch-action: manipulation;
        }

        /* خلفية متحركة مع نجوم - محسّن */
        .bg-stars {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            background: radial-gradient(ellipse at 50% 50%, #1a0033 0%, #000 100%);
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle-star 3s infinite;
            will-change: opacity;
        }

        @keyframes twinkle-star {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* الخلفية الرئيسية - عالم سحري */
        .magic-bg {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            overflow: hidden;
        }

        .aurora {
            position: absolute;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, 
                transparent 0%,
                rgba(255, 20, 147, 0.1) 10%,
                transparent 20%,
                rgba(138, 43, 226, 0.08) 30%,
                transparent 40%,
                rgba(255, 20, 147, 0.1) 50%,
                transparent 60%,
                rgba(200, 100, 255, 0.08) 70%,
                transparent 80%,
                rgba(255, 20, 147, 0.08) 90%,
                transparent 100%
            );
            animation: aurora-dance 15s ease-in-out infinite;
            filter: blur(60px);
            will-change: transform;
        }

        @keyframes aurora-dance {
            0%, 100% { 
                transform: translate(-50%, -50%) rotate(0deg);
                opacity: 0.3;
            }
            50% { 
                transform: translate(-30%, -30%) rotate(180deg);
                opacity: 0.5;
            }
        }

        /* جزيئات سحرية - أقل عدداً */
        .particle-container {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            pointer-events: none;
        }

        .particle.orb {
            width: 8px;
            height: 8px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.6), rgba(255, 20, 147, 0.3));
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.4);
            will-change: transform;
        }

        @keyframes float-orb {
            0% {
                transform: translate(0, 0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
                transform: scale(1);
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        /* البطاقة الرئيسية */
        .main-container {
            position: fixed;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
        }

        .card-wrapper {
            perspective: 1200px;
            position: relative;
            width: 100%;
            max-width: 500px;
        }

        .card {
            position: relative;
            width: 100%;
            padding: 60px 40px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 20, 147, 0.3);
            border-radius: 35px;
            backdrop-filter: blur(15px);
            box-shadow: 
                0 0 40px rgba(255, 20, 147, 0.3),
                0 0 80px rgba(138, 43, 226, 0.15),
                inset 0 0 40px rgba(255, 20, 147, 0.08);
            text-align: center;
            animation: card-float 6s ease-in-out infinite, card-glow 3s ease-in-out infinite;
            will-change: transform;
        }

        @keyframes card-float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        @keyframes card-glow {
            0%, 100% {
                box-shadow: 
                    0 0 40px rgba(255, 20, 147, 0.3),
                    0 0 80px rgba(138, 43, 226, 0.15),
                    inset 0 0 40px rgba(255, 20, 147, 0.08);
            }
            50% {
                box-shadow: 
                    0 0 60px rgba(255, 20, 147, 0.5),
                    0 0 120px rgba(138, 43, 226, 0.3),
                    inset 0 0 60px rgba(255, 20, 147, 0.15);
            }
        }

        /* النص الرئيسي */
        .emoji-main {
            font-size: 3.5em;
            margin-bottom: 15px;
            animation: emoji-bounce 1.2s ease-in-out infinite;
            filter: drop-shadow(0 0 15px rgba(255, 20, 147, 0.4));
            line-height: 1;
            will-change: transform;
        }

        @keyframes emoji-bounce {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-15px) scale(1.08);
            }
        }

        .title {
            font-size: 2em;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ff1493, #ff69b4, #ff1493);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: text-shimmer 3s ease infinite;
            letter-spacing: 1px;
        }

        @keyframes text-shimmer {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .name {
            font-size: 3em;
            font-weight: 900;
            background: linear-gradient(45deg, #ff1493, #ffb6d9, #ff69b4, #ff1493);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 4s ease infinite;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(255, 20, 147, 0.3));
            letter-spacing: 2px;
        }

        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .divider {
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ff1493, transparent);
            margin: 20px auto;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.5);
            animation: divider-glow 2s ease-in-out infinite;
        }

        @keyframes divider-glow {
            0%, 100% {
                box-shadow: 0 0 15px rgba(255, 20, 147, 0.5);
                opacity: 0.6;
            }
            50% {
                box-shadow: 0 0 30px rgba(255, 20, 147, 0.8);
                opacity: 1;
            }
        }

        .date {
            font-size: 1.5em;
            color: #ffb6d9;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: 1px;
            animation: date-pulse 2s ease-in-out infinite;
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.6);
        }

        @keyframes date-pulse {
            0%, 100% {
                transform: scale(1);
                text-shadow: 0 0 10px rgba(255, 182, 193, 0.6);
            }
            50% {
                transform: scale(1.03);
                text-shadow: 0 0 20px rgba(255, 182, 193, 0.8);
            }
        }

        .magic-text {
            font-size: 1.3em;
            color: #fff;
            margin-bottom: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            animation: glow-text 2s ease-in-out infinite;
        }

        @keyframes glow-text {
            0%, 100% {
                color: #ffb6d9;
                text-shadow: 0 0 8px rgba(255, 182, 193, 0.4);
            }
            50% {
                color: #fff;
                text-shadow: 0 0 15px rgba(255, 20, 147, 0.6);
            }
        }

        .message {
            color: #e0e0e0;
            font-size: 0.95em;
            line-height: 1.8;
            margin-bottom: 15px;
            font-weight: 400;
            animation: message-fade 3s ease-in-out infinite;
        }

        @keyframes message-fade {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        .special-message {
            font-size: 1.05em;
            color: #ffb6d9;
            font-style: italic;
            font-weight: 600;
            margin-bottom: 15px;
            animation: special-glow 2s ease-in-out infinite;
            text-shadow: 0 0 15px rgba(255, 182, 193, 0.4);
        }

        @keyframes special-glow {
            0%, 100% {
                text-shadow: 0 0 15px rgba(255, 182, 193, 0.4);
                filter: brightness(1);
            }
            50% {
                text-shadow: 0 0 30px rgba(255, 182, 193, 0.8);
                filter: brightness(1.1);
            }
        }

        .emoji-bottom {
            font-size: 2.5em;
            margin: 15px 0;
            animation: emoji-rotate 4s linear infinite;
            filter: drop-shadow(0 0 10px rgba(255, 20, 147, 0.3));
            line-height: 1;
            will-change: transform;
        }

        @keyframes emoji-rotate {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(90deg) scale(1.08); }
            50% { transform: rotate(180deg) scale(1); }
            75% { transform: rotate(270deg) scale(1.08); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* الزر السحري */
        .magic-button {
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 50%, #ffb6d9 100%);
            background-size: 300% 300%;
            color: white;
            border: 2px solid rgba(255, 20, 147, 0.5);
            padding: 14px 35px;
            font-size: 1.05em;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 18px;
            font-weight: 700;
            transition: all 0.2s ease;
            box-shadow: 
                0 0 25px rgba(255, 20, 147, 0.4),
                0 0 50px rgba(138, 43, 226, 0.2);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
            animation: button-glow 2s ease-in-out infinite;
            width: 100%;
            max-width: 260px;
            will-change: transform;
        }

        .magic-button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translate(-100%, -100%); }
            100% { transform: translate(100%, 100%); }
        }

        @keyframes button-glow {
            0%, 100% {
                box-shadow: 
                    0 0 25px rgba(255, 20, 147, 0.4),
                    0 0 50px rgba(138, 43, 226, 0.2);
            }
            50% {
                box-shadow: 
                    0 0 40px rgba(255, 20, 147, 0.6),
                    0 0 80px rgba(138, 43, 226, 0.3);
            }
        }

        .magic-button:active {
            transform: scale(0.97);
        }

        /* تأثيرات خاصة */
        .hearts-rain {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 5;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            font-size: 1.8em;
            animation: fall-heart 4s linear forwards;
            filter: drop-shadow(0 0 8px rgba(255, 20, 147, 0.6));
            will-change: transform;
        }

        @keyframes fall-heart {
            0% {
                top: -50px;
                opacity: 1;
                transform: translateX(0) rotate(0deg) scale(1);
            }
            50% {
                opacity: 1;
            }
            100% {
                top: 100vh;
                opacity: 0;
                transform: translateX(60px) rotate(360deg) scale(0);
            }
        }

        .sparkle {
            position: absolute;
            width: 2.5px;
            height: 2.5px;
            background: #fff;
            border-radius: 50%;
            animation: sparkle-fly 2s ease-out forwards;
            box-shadow: 0 0 8px rgba(255, 20, 147, 0.6);
            will-change: transform;
        }

        @keyframes sparkle-fly {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .card {
                padding: 45px 30px;
                border-radius: 30px;
            }

            .name {
                font-size: 2.2em;
            }

            .title {
                font-size: 1.5em;
            }

            .emoji-main {
                font-size: 2.8em;
            }

            .message {
                font-size: 0.9em;
                margin-bottom: 12px;
            }

            .magic-button {
                padding: 12px 30px;
                font-size: 0.95em;
            }
        }

        @media (max-width: 400px) {
            .card {
                padding: 35px 25px;
                border-radius: 25px;
            }

            .name {
                font-size: 1.9em;
            }

            .title {
                font-size: 1.3em;
            }

            .emoji-main {
                font-size: 2.3em;
            }

            .message {
                font-size: 0.85em;
            }

            .emoji-bottom {
                font-size: 2em;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="bg-stars" id="starsContainer"></div>
    <div class="magic-bg">
        <div class="aurora"></div>
    </div>

    <div class="particle-container" id="particleContainer"></div>
    <div class="hearts-rain" id="heartsContainer"></div>

    <div class="main-container">
        <div class="card-wrapper">
            <div class="card">
                <div class="emoji-main">✨🌹💕</div>
                <h1 class="title">عيد ميلاد حبيبتي</h1>
                <h1 class="name">رغد</h1>
                <div class="divider"></div>
                <div class="date">18 أغسطس</div>
                <div class="magic-text">💫 يوم ملكتي الجميلة 💫</div>
                <div class="message">
                    كل يوم معك هو عيد، لكن هذا اليوم خاص لأنه يوم حبيبتي. أنتِ ليستِ مجرد امرأة، أنتِ حياتي وروحي.
                </div>
                <div class="special-message">
                    أتمنى أن تكون كل ثانية من حياتك مليئة بالحب والسعادة. أنتِ تستحقين أجمل الأشياء! 💕
                </div>
                <div class="emoji-bottom">💑💎👑</div>
                <button class="magic-button" onclick="triggerMagic()">اضغطي ✨ حبي</button>
            </div>
        </div>
    </div>

    <script>
        // إنشاء النجوم - عدد أقل
        function createStars() {
            const container = document.getElementById('starsContainer');
            const starCount = window.innerWidth <= 768 ? 50 : 80;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 0.5;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDuration = (Math.random() * 2.5 + 2) + 's';
                star.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(star);
            }
        }

        // إنشاء الجزيئات - تقليل التكرار
        function createParticles() {
            const container = document.getElementById('particleContainer');
            const interval = 400;
            let particleCount = 0;
            const maxParticles = 8;
            
            setInterval(() => {
                if (particleCount >= maxParticles) return;
                
                const particle = document.createElement('div');
                particle.className = 'particle orb';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 200 + 100;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                particle.style.animation = `float-orb ${Math.random() * 2.5 + 2.5}s ease-out forwards`;
                
                container.appendChild(particle);
                particleCount++;
                
                setTimeout(() => {
                    particle.remove();
                    particleCount--;
                }, 4500);
            }, interval);
        }

        // قلوب الحب
        function createHeart() {
            const container = document.getElementById('heartsContainer');
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '💗';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            container.appendChild(heart);
            
            setTimeout(() => heart.remove(), 5500);
        }

        // البريق
        function createSparkles(x, y) {
            const container = document.getElementById('heartsContainer');
            const sparkleCount = window.innerWidth <= 768 ? 12 : 18;
            
            for (let i = 0; i < sparkleCount; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = x + 'px';
                sparkle.style.top = y + 'px';
                
                const angle = (i / sparkleCount) * Math.PI * 2;
                const distance = Math.random() * 200 + 100;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                sparkle.style.setProperty('--tx', tx + 'px');
                sparkle.style.setProperty('--ty', ty + 'px');
                sparkle.style.animationDuration = (Math.random() * 0.8 + 1.2) + 's';
                
                container.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 2000);
            }
        }

        // السحر الكبير
        function triggerMagic() {
            const card = document.querySelector('.card');
            card.style.animation = 'none';
            
            setTimeout(() => {
                card.style.animation = 'card-float 6s ease-in-out infinite, card-glow 3s ease-in-out infinite';
            }, 10);

            for (let i = 0; i < 6; i++) {
                setTimeout(() => {
                    createHeart();
                    createSparkles(
                        window.innerWidth / 2,
                        window.innerHeight / 2
                    );
                }, i * 150);
            }
        }

        // تهيئة الصفحة
        window.addEventListener('load', () => {
            createStars();
            createParticles();
            
            setInterval(() => {
                if (Math.random() > 0.8) {
                    createHeart();
                }
            }, 2000);
        });

        // كليك/تاب
        document.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON') {
                createSparkles(e.clientX, e.clientY);
            }
        });
    </script>
</body>
</html>
