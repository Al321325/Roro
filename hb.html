<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ عيد ميلاد رغد - عالم السحر ✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Poppins', 'Arial', sans-serif;
            background: #000;
            position: relative;
        }

        /* خلفية متحركة مع نجوم */
        .bg-stars {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            background: radial-gradient(ellipse at 50% 50%, #1a0033 0%, #000 100%);
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle-star 3s infinite;
        }

        @keyframes twinkle-star {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* الخلفية الرئيسية - عالم سحري */
        .magic-bg {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            overflow: hidden;
        }

        .aurora {
            position: absolute;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, 
                transparent 0%,
                rgba(255, 20, 147, 0.15) 10%,
                transparent 20%,
                rgba(138, 43, 226, 0.12) 30%,
                transparent 40%,
                rgba(255, 20, 147, 0.15) 50%,
                transparent 60%,
                rgba(200, 100, 255, 0.1) 70%,
                transparent 80%,
                rgba(255, 20, 147, 0.12) 90%,
                transparent 100%
            );
            animation: aurora-dance 15s ease-in-out infinite;
            filter: blur(80px);
        }

        @keyframes aurora-dance {
            0%, 100% { 
                transform: translate(-50%, -50%) rotate(0deg);
                opacity: 0.4;
            }
            50% { 
                transform: translate(-30%, -30%) rotate(180deg);
                opacity: 0.6;
            }
        }

        /* جزيئات سحرية طائرة */
        .particle-container {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            pointer-events: none;
            filter: blur(1px);
        }

        .particle.orb {
            width: 10px;
            height: 10px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(255, 20, 147, 0.4));
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.6);
        }

        @keyframes float-orb {
            0% {
                transform: translate(0, 0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
                transform: scale(1);
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        /* البطاقة الرئيسية - متطورة جداً */
        .main-container {
            position: fixed;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .card-wrapper {
            perspective: 1200px;
            position: relative;
        }

        .card {
            position: relative;
            width: 500px;
            padding: 80px 60px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 20, 147, 0.3);
            border-radius: 40px;
            backdrop-filter: blur(20px);
            box-shadow: 
                0 0 60px rgba(255, 20, 147, 0.4),
                0 0 120px rgba(138, 43, 226, 0.2),
                inset 0 0 60px rgba(255, 20, 147, 0.1);
            text-align: center;
            animation: card-float 6s ease-in-out infinite, card-glow 3s ease-in-out infinite;
            transform: translateZ(0);
        }

        @keyframes card-float {
            0%, 100% {
                transform: translateY(0px) rotateX(0deg);
            }
            50% {
                transform: translateY(-30px) rotateX(5deg);
            }
        }

        @keyframes card-glow {
            0%, 100% {
                box-shadow: 
                    0 0 60px rgba(255, 20, 147, 0.4),
                    0 0 120px rgba(138, 43, 226, 0.2),
                    inset 0 0 60px rgba(255, 20, 147, 0.1);
            }
            50% {
                box-shadow: 
                    0 0 80px rgba(255, 20, 147, 0.6),
                    0 0 160px rgba(138, 43, 226, 0.4),
                    inset 0 0 80px rgba(255, 20, 147, 0.2);
            }
        }

        /* النص الرئيسي */
        .emoji-main {
            font-size: 4em;
            margin-bottom: 20px;
            animation: emoji-bounce 1.2s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255, 20, 147, 0.6));
        }

        @keyframes emoji-bounce {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-25px) scale(1.1);
            }
        }

        .title {
            font-size: 2.5em;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff1493, #ff69b4, #ff1493);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: text-shimmer 3s ease infinite;
            text-shadow: 0 0 30px rgba(255, 20, 147, 0.3);
            letter-spacing: 2px;
        }

        @keyframes text-shimmer {
            0%, 100% {
                background-position: 0% 50%;
                filter: brightness(1);
            }
            50% {
                background-position: 100% 50%;
                filter: brightness(1.3);
            }
        }

        .name {
            font-size: 3.5em;
            font-weight: 900;
            background: linear-gradient(45deg, #ff1493, #ffb6d9, #ff69b4, #ff1493);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 4s ease infinite;
            margin-bottom: 30px;
            filter: drop-shadow(0 0 30px rgba(255, 20, 147, 0.5));
            letter-spacing: 3px;
        }

        @keyframes gradient-shift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .divider {
            width: 120px;
            height: 4px;
            background: linear-gradient(90deg, transparent, #ff1493, transparent);
            margin: 30px auto;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.6);
            animation: divider-glow 2s ease-in-out infinite;
        }

        @keyframes divider-glow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(255, 20, 147, 0.6);
                opacity: 0.6;
            }
            50% {
                box-shadow: 0 0 40px rgba(255, 20, 147, 1);
                opacity: 1;
            }
        }

        .date {
            font-size: 1.8em;
            color: #ffb6d9;
            font-weight: 700;
            margin-bottom: 30px;
            letter-spacing: 2px;
            animation: date-pulse 2s ease-in-out infinite;
            text-shadow: 0 0 15px rgba(255, 182, 193, 0.8);
        }

        @keyframes date-pulse {
            0%, 100% {
                transform: scale(1);
                text-shadow: 0 0 15px rgba(255, 182, 193, 0.8);
            }
            50% {
                transform: scale(1.05);
                text-shadow: 0 0 30px rgba(255, 182, 193, 1);
            }
        }

        .magic-text {
            font-size: 1.6em;
            color: #fff;
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 1px;
            animation: glow-text 2s ease-in-out infinite;
        }

        @keyframes glow-text {
            0%, 100% {
                color: #ffb6d9;
                text-shadow: 0 0 10px rgba(255, 182, 193, 0.5);
            }
            50% {
                color: #fff;
                text-shadow: 0 0 20px rgba(255, 20, 147, 0.8);
            }
        }

        .message {
            color: #e0e0e0;
            font-size: 1.2em;
            line-height: 2;
            margin-bottom: 25px;
            font-weight: 400;
            animation: message-fade 3s ease-in-out infinite;
        }

        @keyframes message-fade {
            0%, 100% {
                opacity: 0.8;
            }
            50% {
                opacity: 1;
            }
        }

        .special-message {
            font-size: 1.3em;
            color: #ffb6d9;
            font-style: italic;
            font-weight: 600;
            margin-bottom: 25px;
            animation: special-glow 2s ease-in-out infinite;
            text-shadow: 0 0 20px rgba(255, 182, 193, 0.6);
        }

        @keyframes special-glow {
            0%, 100% {
                text-shadow: 0 0 20px rgba(255, 182, 193, 0.6);
                filter: brightness(1);
            }
            50% {
                text-shadow: 0 0 40px rgba(255, 182, 193, 1);
                filter: brightness(1.2);
            }
        }

        .emoji-bottom {
            font-size: 3em;
            margin: 20px 0;
            animation: emoji-rotate 4s linear infinite;
            filter: drop-shadow(0 0 15px rgba(255, 20, 147, 0.5));
        }

        @keyframes emoji-rotate {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(90deg) scale(1.1); }
            50% { transform: rotate(180deg) scale(1); }
            75% { transform: rotate(270deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* الزر السحري */
        .magic-button {
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 50%, #ffb6d9 100%);
            background-size: 300% 300%;
            color: white;
            border: 2px solid rgba(255, 20, 147, 0.5);
            padding: 18px 50px;
            font-size: 1.3em;
            border-radius: 60px;
            cursor: pointer;
            margin-top: 30px;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 
                0 0 30px rgba(255, 20, 147, 0.5),
                0 0 60px rgba(138, 43, 226, 0.3);
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            animation: button-glow 2s ease-in-out infinite;
        }

        .magic-button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translate(-100%, -100%); }
            100% { transform: translate(100%, 100%); }
        }

        @keyframes button-glow {
            0%, 100% {
                box-shadow: 
                    0 0 30px rgba(255, 20, 147, 0.5),
                    0 0 60px rgba(138, 43, 226, 0.3);
                transform: scale(1);
            }
            50% {
                box-shadow: 
                    0 0 50px rgba(255, 20, 147, 0.8),
                    0 0 100px rgba(138, 43, 226, 0.5);
                transform: scale(1.05);
            }
        }

        .magic-button:hover {
            transform: translateY(-5px) scale(1.1);
            box-shadow: 
                0 0 60px rgba(255, 20, 147, 0.8),
                0 0 120px rgba(138, 43, 226, 0.6);
        }

        .magic-button:active {
            transform: translateY(-2px) scale(1.08);
        }

        /* تأثيرات خاصة */
        .hearts-rain {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 5;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            font-size: 2.5em;
            animation: fall-heart 4s linear forwards;
            filter: drop-shadow(0 0 10px rgba(255, 20, 147, 0.8));
        }

        @keyframes fall-heart {
            0% {
                top: -50px;
                opacity: 1;
                transform: translateX(0) rotate(0deg) scale(1);
            }
            50% {
                opacity: 1;
            }
            100% {
                top: 100vh;
                opacity: 0;
                transform: translateX(100px) rotate(360deg) scale(0);
            }
        }

        .sparkle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #fff;
            border-radius: 50%;
            animation: sparkle-fly 2s ease-out forwards;
            box-shadow: 0 0 10px rgba(255, 20, 147, 0.8);
        }

        @keyframes sparkle-fly {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .card {
                width: 350px;
                padding: 60px 40px;
            }

            .name {
                font-size: 2.5em;
            }

            .title {
                font-size: 1.8em;
            }

            .emoji-main {
                font-size: 3em;
            }
        }
    </style>
</head>
<body>
    <div class="bg-stars" id="starsContainer"></div>
    <div class="magic-bg">
        <div class="aurora"></div>
    </div>

    <div class="particle-container" id="particleContainer"></div>
    <div class="hearts-rain" id="heartsContainer"></div>

    <div class="main-container">
        <div class="card-wrapper">
            <div class="card">
                <div class="emoji-main">✨🌟💖</div>
                <h1 class="title">عيد ميلاد سعيد</h1>
                <h1 class="name">رغد</h1>
                <div class="divider"></div>
                <div class="date">18 أغسطس</div>
                <div class="magic-text">💫 يوم ساحر لنجمة ساحرة 💫</div>
                <div class="message">
                    في هذا اليوم الخاص، ينيرُ الكون كله بوجودك الرائع. أنتِ قطعة من السحر تسيرين بين البشر، تنثرين الفرح والجمال مع كل خطوة.
                </div>
                <div class="special-message">
                    لتكن هذه السنة أجمل ما عشتِ، مليئة بالأحلام التي تتحقق والذكريات التي تخلدين! 💕✨
                </div>
                <div class="emoji-bottom">🎂🌹🦋</div>
                <button class="magic-button" onclick="triggerMagic()">اضغطي ✨ للسحر</button>
            </div>
        </div>
    </div>

    <script>
        // إنشاء النجوم
        function createStars() {
            const container = document.getElementById('starsContainer');
            for (let i = 0; i < 150; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                star.style.animationDelay = Math.random() * 3 + 's';
                container.appendChild(star);
            }
        }

        // إنشاء الجزيئات السحرية
        function createParticles() {
            const container = document.getElementById('particleContainer');
            setInterval(() => {
                const particle = document.createElement('div');
                particle.className = 'particle orb';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 300 + 200;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                particle.style.animation = `float-orb ${Math.random() * 3 + 3}s ease-out forwards`;
                
                container.appendChild(particle);
                setTimeout(() => particle.remove(), 6000);
            }, 200);
        }

        // قلوب الحب الساقطة
        function createHeart() {
            const container = document.getElementById('heartsContainer');
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '💗';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            heart.style.animationDelay = Math.random() * 1 + 's';
            container.appendChild(heart);
            setTimeout(() => heart.remove(), 5500);
        }

        // ألعاب نارية براقة
        function createSparkles(x, y) {
            const container = document.getElementById('heartsContainer');
            for (let i = 0; i < 30; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = x + 'px';
                sparkle.style.top = y + 'px';
                
                const angle = (i / 30) * Math.PI * 2;
                const distance = Math.random() * 300 + 200;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                sparkle.style.setProperty('--tx', tx + 'px');
                sparkle.style.setProperty('--ty', ty + 'px');
                sparkle.style.animationDuration = (Math.random() * 1 + 1.5) + 's';
                
                container.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 2500);
            }
        }

        // السحر الكبير
        function triggerMagic() {
            const card = document.querySelector('.card');
            card.style.animation = 'none';
            
            setTimeout(() => {
                card.style.animation = 'card-float 6s ease-in-out infinite, card-glow 3s ease-in-out infinite';
            }, 10);

            // قلوب متعددة
            for (let i = 0; i < 12; i++) {
                setTimeout(() => {
                    createHeart();
                    createSparkles(
                        window.innerWidth / 2,
                        window.innerHeight / 2
                    );
                }, i * 150);
            }
        }

        // تأثير الماوس السحري
        document.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.98) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = e.clientX + 'px';
                sparkle.style.top = e.clientY + 'px';
                sparkle.style.setProperty('--tx', (Math.random() - 0.5) * 100 + 'px');
                sparkle.style.setProperty('--ty', (Math.random() - 0.5) * 100 + 'px');
                sparkle.style.animationDuration = '1.5s';
                document.getElementById('heartsContainer').appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 1500);
            }
        });

        // تهيئة الصفحة
        window.addEventListener('load', () => {
            createStars();
            createParticles();
            
            // قلوب عادية تسقط
            setInterval(() => {
                if (Math.random() > 0.7) {
                    createHeart();
                }
            }, 1000);
        });

        // كليك عشوائي يعطي سحر
        document.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON') {
                createSparkles(e.clientX, e.clientY);
            }
        });
    </script>
</body>
</html>
